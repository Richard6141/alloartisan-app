name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint NON bloquant pour l'instant : dette pré-existante (~99 erreurs,
      # surtout apostrophes non échappées en JSX). À résorber puis rendre bloquant.
      - name: Lint (non bloquant)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
